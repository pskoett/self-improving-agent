name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests (OpenClaw hook)
        run: npm test

      - name: Type-check handler.ts
        run: npm run typecheck

      - name: Run the same tests against compiled TypeScript
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npx --no-install tsc --outDir "$tmp" --strict --skipLibCheck \
            --module commonjs --esModuleInterop --target es2022 \
            self-improving-agent/hooks/openclaw/handler.ts .github/tscheck/openclaw-hooks-stub.d.ts
          cp self-improving-agent/hooks/openclaw/handler.test.js "$tmp/handler.test.js"
          node --test "$tmp/handler.test.js"

      - name: Shell syntax check
        run: npm run check:shell
